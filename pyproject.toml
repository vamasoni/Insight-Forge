[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge"
version = "0.1.0"
description = "Evidence-grounded analytics agent with automated evaluation and regression testing"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "sqlglot>=25",
  "langgraph>=0.2",
  "pandas>=2.0",
  "numpy",
  "scipy",
  "statsmodels",
  "plotly",
  "httpx",
  "pydantic>=2",
  "fastapi",
  "uvicorn",
  "python-dotenv",
]

[project.optional-dependencies]
mcp = ["mcp"]
ui = ["streamlit"]
tracing = ["langfuse"]
dev = ["pytest", "pytest-cov"]
all = ["mcp", "streamlit", "langfuse", "pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["insightforge*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
